name: Deploy Documentation

# Same as the OLC docs deploy: on every push to main, build the mkdocs site and publish it to the
# gh-pages branch, which GitHub Pages serves at https://lakelogic.github.io/lakelogic-mcp/.

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write # mkdocs gh-deploy pushes the built site to the gh-pages branch

concurrency:
    group: docs-deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # gh-deploy needs history to update the gh-pages branch

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install docs dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r docs-requirements.txt

            - name: Deploy to GitHub Pages (mkdocs gh-deploy)
              run: mkdocs gh-deploy --force

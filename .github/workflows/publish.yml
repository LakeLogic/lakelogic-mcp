name: Publish to PyPI

# A pushed `v*` tag builds, tests and publishes. PyPI Trusted Publishing (OIDC): no stored token.
# PyPI must have a trusted publisher for (owner=LakeLogic, repo=lakelogic-mcp,
# workflow=publish.yml, environment=pypi); add it as a "pending publisher" before the first release.

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read
    id-token: write

jobs:
    pypi-publish:
        runs-on: ubuntu-latest
        environment: pypi
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Tag matches the version
              run: |
                  v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
                  test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject v$v"; exit 1; }
            - run: pip install -e ".[dev]" build
            - run: pytest -q
            - run: python -m build
            - uses: pypa/gh-action-pypi-publish@release/v1

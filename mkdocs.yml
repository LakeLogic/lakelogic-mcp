site_name: LakeLogic MCP
site_description: >
  A local MCP server that lets AI assistants check, test and run the Open Lakehouse Contracts
  they write, using LakeLogic itself instead of guessing.
site_url: https://lakelogic.github.io/lakelogic-mcp/
site_author: LakeLogic
repo_name: LakeLogic/lakelogic-mcp
repo_url: https://github.com/LakeLogic/lakelogic-mcp
edit_uri: edit/main/docs/
copyright: >
  Copyright &copy; 2026 LakeLogic ·
  <a href="https://lakelogic.github.io/LakeLogic/" target="_blank">LakeLogic Core</a> ·
  <a href="https://lakelogic.github.io/open-lakehouse-contract/" target="_blank">Open Lakehouse Contract</a>

use_directory_urls: false
dev_addr: 127.0.0.1:8012

theme:
  # Same look as the LakeLogic Core docs: its overrides, stylesheet and theme switcher.
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: "Inter"
    code: "JetBrains Mono"
  palette:
    - scheme: default
      primary: custom
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Overview: index.md
  - Install: install.md
  - Walkthrough: walkthrough.md
  - Tools: tools.md
  - Safety and privacy: safety.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  # Bump ?v= on every extra.css change: GitHub Pages serves it unhashed.
  - stylesheets/extra.css?v=3

extra_javascript:
  - javascripts/theme-switcher.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LakeLogic/lakelogic-mcp

[project]
name = "lakelogic-mcp"
version = "0.1.2"
description = "A local MCP server that lets AI assistants validate, lint and explain Open Lakehouse Contracts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LakeLogic Team", email = "lakelogic@gmail.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "data-contracts",
    "data-contract-validation",
    "schema-validation",
    "data-quality",
    "lakehouse",
    "yaml",
    "ai-assistant",
    "synthetic-data",
    "claude",
    "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.2",  # 1.x (FastMCP) and 2.x (MCPServer) both supported
    "lakelogic>=1.78.0",  # the lint rule catalogue (explain_rule) ships in 1.78.0
    "open-lakehouse-contract>=0.24.0",
]

[project.urls]
Homepage = "https://lakelogic.io"
Documentation = "https://lakelogic.github.io/lakelogic-mcp/"
Repository = "https://github.com/LakeLogic/lakelogic-mcp"
Issues = "https://github.com/LakeLogic/lakelogic-mcp/issues"
"Open Lakehouse Contract" = "https://lakelogic.github.io/open-lakehouse-contract/"

[project.scripts]
lakelogic-mcp = "lakelogic_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakelogic_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Releases: release.bat (commitizen bumps, git-cliff writes CHANGELOG.md). The version lives in
# five places; commitizen updates all of them together so they can never disagree again
# (until 2026-10-24 __init__.py said 0.1.0 while the package was 0.1.2).
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
update_changelog_on_bump = false
major_version_zero = true
version_files = [
    "src/lakelogic_mcp/__init__.py:__version__",
    "server.json:\"version\"",
    "plugins/lakelogic-mcp/.claude-plugin/plugin.json:\"version\"",
]
